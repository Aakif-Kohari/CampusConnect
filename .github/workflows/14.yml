name: "14"

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  auto-merge:
    name: Label and Auto-Merge PRs
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and Process PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            async function processPR(prNumber) {
              console.log(`\nEvaluating PR #${prNumber}`);
              
              let mergeable = null;
              let mergeableState = null;
              
              // Retry loop because PR mergeable state might be null immediately after creation
              let pr = null;
              for (let attempt = 1; attempt <= 10; attempt++) {
                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber
                });
                pr = response.data;
                
                mergeable = pr.mergeable;
                mergeableState = pr.mergeable_state;
                
                if (mergeable !== null) {
                  break;
                }
                
                console.log(`Mergeable status is null, retrying (${attempt}/10) in 5 seconds...`);
                await new Promise(r => setTimeout(r, 5000));
              }

              if (!pr) return;

              // Analyze PR and add good-* label
              const currentLabels = pr.labels.map(l => l.name);
              const hasGoodLabel = currentLabels.some(l => l.startsWith('good-'));

              if (!hasGoodLabel) {
                console.log("PR does not have a good-* label. Manual review required. Skipping merge.");
                return;
              } else {
                console.log(`PR already has a good-* label.`);
              }
              
              if (mergeable === false) {
                console.log("Merge conflicts detected. Cannot merge.");
              } else {
                console.log(`PR is mergeable and correctly labeled. Proceeding with immediate auto-merge.`);
                try {
                  console.log(`Auto-merging PR #${prNumber} into main...`);
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: prNumber,
                    merge_method: 'squash'
                  });
                  console.log(`✅ Successfully merged PR #${prNumber}`);
                  console.log(`Waiting for 2 minutes before processing the next PR...`);
                  await new Promise(resolve => setTimeout(resolve, 120000));
                } catch (e) {
                  console.error(`❌ Failed to auto-merge PR #${prNumber}:`, e.message);
                  
                  // If it fails to merge because it's behind, try updating the branch
                  if (e.message.includes("out of date") || mergeableState === "behind") {
                    console.log("🔄 Attempting to update branch...");
                    try {
                      await github.rest.pulls.updateBranch({ owner, repo, pull_number: prNumber });
                      console.log(`✅ PR #${prNumber} branch successfully updated. It will re-trigger the workflow.`);
                    } catch (updateError) {
                      console.error(`❌ Failed to update branch: ${updateError.message}`);
                    }
                  }
                }
              }
            }

            if (context.eventName === "workflow_dispatch") {
              console.log("Manual trigger detected. Fetching all open PRs...");
              let page = 1;
              let hasMore = true;
              while (hasMore) {
                const { data: openPRs } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  page
                });
                for (const pr of openPRs) {
                  await processPR(pr.number);
                }
                if (openPRs.length < 100) hasMore = false;
                page++;
              }
              console.log("✅ Finished processing all open PRs.");
            } else {
              const prNumber = context.payload.pull_request.number;
              await processPR(prNumber);
            }
