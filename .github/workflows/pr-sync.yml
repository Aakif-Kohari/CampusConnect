name: PR Sync

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  sync-issue-to-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Sync Assignees and Labels from Linked Issue
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const regex = /(?:fix(?:e[sd])?|resolve[sd]?|close[sd]?)\s+(?:#(\d+)|https:\/\/github\.com\/[^\/]+\/[^\/]+\/issues\/(\d+))/i;
            const match = prBody.match(regex);

            if (!match) {
              console.log('No linked issue found in the PR body.');
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number
                });
                
                const hasBotComment = comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes('closing keyword'));
                
                if (!hasBotComment) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    body: '⚠️ **Missing Closing Keyword**\n\nIt looks like you haven\'t linked an issue to this pull request. Please include a closing keyword (e.g., `Resolves #123` or `Fixes #123`) in the **PR description** to link it to an issue. This will automatically sync labels and assignees.'
                  });
                  console.log('Added missing keyword comment.');
                }
              } catch (commentError) {
                console.error('Failed to add missing keyword comment:', commentError.message);
              }
              return;
            }

            const issueNumber = parseInt(match[1] || match[2], 10);
            console.log(`Found linked issue: #${issueNumber}`);

            try {
              // Fetch the linked issue
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              
              // Get Assignees
              const assignees = issue.assignees.map(a => a.login);
              if (assignees.length > 0) {
                console.log(`Assigning PR to: ${assignees.join(', ')}`);
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    assignees: assignees
                  });
                } catch (assignError) {
                  console.error('Failed to add assignees:', assignError.message);
                }
              } else {
                console.log('Linked issue has no assignees.');
              }
              
              // Get Labels
              let labels = issue.labels.map(l => l.name);
              
              // Wait for auto-labeler to add labels (race condition check)
              let retries = 0;
              while (labels.length === 0 && retries < 5) {
                console.log('No labels found on issue, waiting 5s for auto-labeler...');
                await new Promise(r => setTimeout(r, 5000));
                
                const { data: updatedIssue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                labels = updatedIssue.labels.map(l => l.name);
                retries++;
              }
              
              if (labels.length > 0) {
                console.log(`Adding labels to PR: ${labels.join(', ')}`);
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    labels: labels
                  });
                } catch (labelError) {
                  console.error('Failed to add labels:', labelError.message);
                }
              } else {
                console.log('Linked issue has no labels.');
              }
              
            } catch (error) {
              console.error(`Failed to fetch issue #${issueNumber}:`, error.message);
            }
